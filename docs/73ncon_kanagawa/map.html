<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2026 神工校内マップ - 第七十三回NHK杯全国高校放送コンテスト 神奈川県大会</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit-cover" />
    <meta name="author" content="Haruka Kato">
    <meta name="description" content="第七十三回NHK杯全国高校放送コンテスト 神奈川県大会の会場マップです。">
    <meta name="keywords" content="地図, マップ, 校内マップ, NHK杯全国高校放送コンテスト, 神奈川県大会, 神工, 放送部, 専門部, 神奈川県高等学校視聴覚研究会, 神高視研, 73">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/map_print.css" media="print">
    <script type="text/javascript" src="js/leaflet.js"></script>
</head>
<body class="rn">
    <header>
        <h1><span class="nhk">ＮＨＫ </span>杯全国高校放送コンテスト<br>神奈川県大会</h1>
    </header>
    <div id="navigation-bar" class="for-sp">
        <ul>
            <li><a href="map.html">フロアマップ</a></li>
            <li><a href="sakuin.html">さくいん</a></li>
            <!--<li><a href="diagnosis.html">診断</a></li>-->
            <li><a href="https://sites.google.com/view/kanakousiken/">集まれ放送委員会</a></li>
            <!--<li><a href="https://www.nhk.or.jp/event/n-con/">NコンWEB</a></li>-->
        </ul>
    </div>
    <main>
        <div class="sroom">
            <p>右上のボタンで階数切り替え</p>
            <div id="map" style="width: 100; height: calc(100vh - 330px); min-height: 100px;"></div>
            <p>ピンチアウトで地図を拡大</p>
        </div>
        <div class="not-safari">
            <p class="imagep" style="text-align: right;">地図の印刷は<a href="#" id="print-map-link" style="text-decoration: underline;">こちら</a></p>
        </div>
        <div class="safari-only">
            <p class="imagep" style="text-align: right;">地図の印刷は<a href="会場図.pdf" target="_blank" rel="noopener noreferrer" style="text-decoration: underline;">こちら</a></p>
        </div>
        <div class="print-map" aria-label="印刷用フロアマップ">
            <figure class="print-map_item">
                <img src="svg/1F.svg" alt="1Fの地図">
            </figure>
            <figure class="print-map_item">
                <img src="svg/2F.svg" alt="2Fの地図">
            </figure>
            <figure class="print-map_item">
                <img src="svg/3F.svg" alt="3Fの地図">
            </figure>
            <figure class="print-map_item">
                <img src="svg/4F.svg" alt="4Fの地図">
            </figure>
            <figure class="print-map_item">
                <img src="svg/5F.svg" alt="5Fの地図">
            </figure>
            <figure class="print-map_item">
                <img src="svg/6F.svg" alt="6Fの地図">
            </figure>
            <figure class="print-map_item">
                <img src="svg/7F.svg" alt="7Fの地図">
            </figure>
            <figure class="print-map_item">
                <img src="svg/8F.svg" alt="8Fの地図">
            </figure>
            <figure class="print-map_item">
                <img src="svg/9F.svg" alt="9Fの地図">
            </figure>
            <figure class="print-map_item">
                <img src="svg/10F.svg" alt="10Fの地図">
            </figure>
        </div>
    </main>
    <footer>
        <p><small>&copy; 2026 神工校内マップ 108期生製作 111期改良 v2.3</small></p>
        <br><br><br><br>
    </footer>
    <script>
        function getParameterByName(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        var map = L.map('map', {
            crs: L.CRS.Simple,
            maxZoom: 1,
            minZoom: -2
        });
        var bounds = [[0,0], [2000,2000]];
        map.fitBounds(bounds);

        var layers={
            "1F": L.imageOverlay("svg/1F.svg", bounds, {
                attribution: "&copy; 神奈川県立神奈川工業高等学校 放送部<br><a href='https://www.pen-kanagawa.ed.jp/kanagawa-th/'>制作：神奈川県立神奈川工業高等学校</a>"
            }),
            "2F": L.imageOverlay("svg/2F.svg", bounds, {
                attribution: "&copy; 神奈川県立神奈川工業高等学校 放送部<br><a href='https://www.pen-kanagawa.ed.jp/kanagawa-th/'>制作：神奈川県立神奈川工業高等学校</a>"
            }),
            "3F": L.imageOverlay("svg/3F.svg", bounds, {
                attribution: "&copy; 神奈川県立神奈川工業高等学校 放送部<br><a href='https://www.pen-kanagawa.ed.jp/kanagawa-th/'>制作：神奈川県立神奈川工業高等学校</a>"
            }),
            "4F": L.imageOverlay("svg/4F.svg", bounds, {
                attribution: "&copy; 神奈川県立神奈川工業高等学校 放送部<br><a href='https://www.pen-kanagawa.ed.jp/kanagawa-th/'>制作：神奈川県立神奈川工業高等学校</a>"
            }),
            "5F": L.imageOverlay("svg/5F.svg", bounds, {
                attribution: "&copy; 神奈川県立神奈川工業高等学校 放送部<br><a href='https://www.pen-kanagawa.ed.jp/kanagawa-th/'>制作：神奈川県立神奈川工業高等学校</a>"
            }),
            "6F": L.imageOverlay("svg/6F.svg", bounds, {
                attribution: "&copy; 神奈川県立神奈川工業高等学校 放送部<br><a href='https://www.pen-kanagawa.ed.jp/kanagawa-th/'>制作：神奈川県立神奈川工業高等学校</a>"
            }),
            "7F": L.imageOverlay("svg/7F.svg", bounds, {
                attribution: "&copy; 神奈川県立神奈川工業高等学校 放送部<br><a href='https://www.pen-kanagawa.ed.jp/kanagawa-th/'>制作：神奈川県立神奈川工業高等学校</a>"
            }),
            "8F": L.imageOverlay("svg/8F.svg", bounds, {
                attribution: "&copy; 神奈川県立神奈川工業高等学校 放送部<br><a href='https://www.pen-kanagawa.ed.jp/kanagawa-th/'>制作：神奈川県立神奈川工業高等学校</a>"
            }),
            "9F": L.imageOverlay("svg/9F.svg", bounds, {
                attribution: "&copy; 神奈川県立神奈川工業高等学校 放送部<br><a href='https://www.pen-kanagawa.ed.jp/kanagawa-th/'>制作：神奈川県立神奈川工業高等学校</a>"
            }),
            "10F": L.imageOverlay("svg/10F.svg", bounds, {
                attribution: "&copy; 神奈川県立神奈川工業高等学校 放送部<br><a href='https://www.pen-kanagawa.ed.jp/kanagawa-th/'>制作：神奈川県立神奈川工業高等学校</a>"
            })
        }
        
        var floor = getParameterByName('floor') || "1F";
        if (layers[floor]) {
            layers[floor].addTo(map);
        }

        L.control.layers(layers, null, {collapsed: false,}).addTo(map);

        map.zoomControl.setPosition("bottomleft");

        document.getElementById("print-map-link").addEventListener("click", function(event) {
            event.preventDefault();
            window.print();
        });

        const ua = window.navigator.userAgent.toLowerCase();

        if (ua.indexOf('safari') !== -1 && ua.indexOf('chrome') === -1 && ua.indexOf('edg') === -1) {
            window.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.keyCode === 80) {
                e.preventDefault();
                window.open("会場図.pdf");
                }
            });
        }
    </script>
</body>
</html>
